<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#e8eee7" />
  <title>Portfolio – Lành Thị Hà Giang</title>
  <meta name="description" content="Portfolio của Lành Thị Hà Giang – Marketing Executive." />
  <style>
    :root{
      --bg:#e8eee7;
      --paper:#f8f5ee;
      --ink:#24352e;
      --sage:#8ea391;
      --line:rgba(69,92,77,.22);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:
      radial-gradient(circle at 14% 6%,rgba(255,255,255,.75),transparent 30%),
      radial-gradient(circle at 88% 28%,rgba(242,229,218,.55),transparent 28%),
      linear-gradient(180deg,#eef2ec 0%,#e6ece5 100%);
      color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;
      scroll-snap-type:y proximity;
    }
    .chapter{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(10px,2.2vw,26px);
      scroll-snap-align:start;
      position:relative;
    }
    .frame{
      width:min(100%,1600px);
      background:var(--paper);
      border:1px solid rgba(100,118,105,.20);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 22px 70px rgba(54,72,60,.14),0 3px 18px rgba(54,72,60,.08);
      position:relative;
    }
    .frame img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
    .cover .frame{cursor:pointer}
    .cover .frame:after{
      content:"Cuộn xuống để mở sách  ↓";
      position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      color:#586b5c;background:rgba(250,248,242,.88);backdrop-filter:blur(10px);
      border:1px solid rgba(89,111,94,.20);border-radius:999px;
      padding:8px 14px;font-size:12px;letter-spacing:.04em;
      opacity:.92;box-shadow:0 4px 14px rgba(48,65,53,.08);
    }
    .dots{
      position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;
      display:flex;flex-direction:column;gap:9px;padding:9px;
      border-radius:999px;background:rgba(247,246,241,.70);backdrop-filter:blur(12px);
      border:1px solid rgba(93,112,97,.16);
    }
    .dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:#b7c2b8;cursor:pointer;transition:.25s}
    .dot.active{background:#5f7865;transform:scale(1.35)}
    .topbar{
      position:fixed;left:14px;top:14px;z-index:20;
      padding:7px 11px;border-radius:999px;background:rgba(247,246,241,.72);
      backdrop-filter:blur(12px);border:1px solid rgba(93,112,97,.16);
      color:#496052;font-size:12px;letter-spacing:.03em;
      opacity:0;transform:translateY(-8px);transition:.3s;pointer-events:none;
    }
    .topbar.show{opacity:1;transform:none}
    .progress{position:fixed;left:0;top:0;width:100%;height:3px;z-index:30;background:transparent}
    .progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#78927d,#c5b7a1);transition:width .1s linear}
    footer{text-align:center;padding:18px 12px 34px;color:#6e7d71;font-size:12px}
    @media (max-width:760px){
      body{scroll-snap-type:none;background:#f2f3ef}
      .chapter{min-height:auto;padding:8px 0}
      .frame{width:100%;border-radius:0;border-left:0;border-right:0;box-shadow:none}
      .dots{display:none}
      .topbar{left:8px;top:8px}
      .cover .frame:after{bottom:9px;font-size:10px;padding:6px 10px}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.dot,.topbar{transition:none}}
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="topbar" id="topbar">LÀNH THỊ HÀ GIANG · PORTFOLIO</div>
  <nav class="dots" id="dots" aria-label="Điều hướng portfolio"></nav>

  <main id="portfolio">
    <section class="chapter cover" id="chapter-1" aria-label="Bìa portfolio"><div class="frame"><img src="assets/slide_01.webp" alt="Bìa portfolio Lành Thị Hà Giang"></div></section>
    <section class="chapter" id="chapter-2"><div class="frame"><img src="assets/slide_02.webp" alt="Mục lục và giới thiệu"></div></section>
    <section class="chapter" id="chapter-3"><div class="frame"><img src="assets/slide_03.webp" alt="Năng lực và công cụ"></div></section>
    <section class="chapter" id="chapter-4"><div class="frame"><img src="assets/slide_04.webp" alt="Hành trình làm việc và dự án"></div></section>
    <section class="chapter" id="chapter-5"><div class="frame"><img src="assets/slide_05.webp" alt="Video production và content commerce"></div></section>
    <section class="chapter" id="chapter-6"><div class="frame"><img src="assets/slide_06.webp" alt="Quản trị hiệu suất nội dung"></div></section>
    <section class="chapter" id="chapter-7"><div class="frame"><img src="assets/slide_07.webp" alt="Thiết kế và hình ảnh"></div></section>
    <section class="chapter" id="chapter-8"><div class="frame"><img src="assets/slide_08.webp" alt="KOL KOC và livestream"></div></section>
    <section class="chapter" id="chapter-9"><div class="frame"><img src="assets/slide_09.webp" alt="Liên hệ"></div></section>
  </main>
  <footer>Portfolio · Lành Thị Hà Giang</footer>

<script>
(() => {
  const chapters=[...document.querySelectorAll('.chapter')];
  const dots=document.getElementById('dots');
  const topbar=document.getElementById('topbar');
  const progress=document.getElementById('progressBar');

  chapters.forEach((section,i)=>{
    const b=document.createElement('button');
    b.className='dot'; b.type='button';
    b.setAttribute('aria-label','Đi đến phần '+(i+1));
    b.addEventListener('click',()=>section.scrollIntoView({behavior:'smooth',block:'start'}));
    dots.appendChild(b);
  });
  const dotEls=[...dots.children];

  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const i=chapters.indexOf(entry.target);
        dotEls.forEach((d,k)=>d.classList.toggle('active',k===i));
        topbar.classList.toggle('show',i>0);
      }
    });
  },{threshold:.55});
  chapters.forEach(c=>observer.observe(c));

  document.querySelector('.cover .frame').addEventListener('click',()=>chapters[1].scrollIntoView({behavior:'smooth'}));

  const update=()=>{
    const doc=document.documentElement;
    const max=doc.scrollHeight-innerHeight;
    const pct=max>0?(scrollY/max)*100:0;
    progress.style.width=Math.min(100,Math.max(0,pct))+'%';
  };
  addEventListener('scroll',update,{passive:true}); update();
})();
</script>
</body>
</html>
